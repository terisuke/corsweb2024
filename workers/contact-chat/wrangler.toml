name = "cor-contact-chat"
main = "src/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]
# cor-jp.com ゾーンを持つアカウント（Company@cor-jp.com）。yomimono と同一アカウント。
account_id = "9973f2d2304b58a1f90d4d9409e9f8cc"

# cor-jp.com の /api/contact* だけをこの Worker に流す（HP本体は Firebase のまま）。
# 問い合わせウィジェットは cor-jp.com 上に置かれ、同一オリジンで叩く（CORSなし）。
routes = [{ pattern = "cor-jp.com/api/contact/*", zone_name = "cor-jp.com" }]

# 公開可能な設定値（非シークレット）。
[vars]
# LLM プロバイダ。既定は 'anthropic'。将来 'openai' / 'self-hosted' を追加できる抽象化済み。
LLM_PROVIDER = "anthropic"
# 問い合わせメールの宛先/差出人（PIIではなく運用設定。シークレットにしてもよい）。
CONTACT_TO_EMAIL = "info@cor-jp.com"
CONTACT_FROM_EMAIL = "noreply@cor-jp.com"

# シークレットは `wrangler secret put <NAME>` で登録（値はコードに出ない）:
#   ANTHROPIC_API_KEY   ... Claude（LLM_PROVIDER=anthropic のとき必須。未設定なら fail closed）
#   RESEND_API_KEY      ... Resend のAPIキー（/submit の送信に必須。未設定なら 503 fail closed）
#   TURNSTILE_SECRET    ... Cloudflare Turnstile のシークレット（任意。未設定なら検証スキップ＝fail open）
# ↑ ANTHROPIC_API_KEY 未設定だと /chat を拒否（fail closed）。
#   RESEND_API_KEY 未設定だと /submit を 503（本物の問い合わせを握り潰さない）。
