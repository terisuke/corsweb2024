name = "cor-yomimono"
main = "src/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]
# cor-jp.com ゾーンを持つアカウント（Company@cor-jp.com）。ルートはこのゾーンに作られる。
account_id = "9973f2d2304b58a1f90d4d9409e9f8cc"

# cor-jp.com の /blog-admin* だけをこの Worker に流す（HP本体は Firebase のまま）。
# cor-jp.com は Cloudflare の裏にいるため、このルートで「HPと同じドメインの隠しページ」になる。
routes = [{ pattern = "cor-jp.com/blog-admin*", zone_name = "cor-jp.com" }]

# 公開可能な設定値（非シークレット）。記事botのIDは公開情報なのでここでOK。
[vars]
GH_OWNER = "Cor-Incorporated"
GH_REPO = "corsweb2024"
GH_APP_ID = "4138716"
GH_INSTALLATION_ID = "142454743"
BLOG_DIR = "src/content/blog"
PUBLISH_BRANCH = "main"
STYLE_GUIDE_PATH = "docs/blog-style-guide.md"
# ↓ BASE_PATH は上の routes の pattern と必ず一致させること（/blog-admin ⇔ cor-jp.com/blog-admin*）
BASE_PATH = "/blog-admin"          # cor-jp.com/blog-admin* に載せるためのプレフィックス

# シークレットは `wrangler secret put <NAME>` で登録（値はコードに出ない）:
#   ANTHROPIC_API_KEY   ... Claude（既存 blog-autodraft 用と同じでOK）
#   GH_APP_PRIVATE_KEY  ... GitHub App の .pem ファイルの中身（-----BEGIN...END----- 全部）
#   ACCESS_PASSWORD     ... ログインの合言葉（チーム共通）
#   SESSION_SECRET      ... セッション署名鍵。例: openssl rand -hex 32 の出力
# ↑ ACCESS_PASSWORD と SESSION_SECRET の両方が未設定だと全リクエストを拒否（fail closed）
