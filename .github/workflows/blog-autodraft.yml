name: Blog auto-draft (Claude)

# 毎日 Claude が web_search で最新トピックを調べ、社長の文体で記事の「下書き」を1本生成し、
# PR を作る（draft-review）。公開は人が承認（isDraft:false にしてマージ）して初めて行われる。
# まず手動(workflow_dispatch)で試してから、cron を有効化するのがおすすめ。

on:
  workflow_dispatch:
  schedule:
    # 06:00 JST（= 前日 21:00 UTC）。試運転が済むまでは下のcronをコメントアウト運用でもOK。
    - cron: '0 21 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (develop = 統合ブランチ)
        uses: actions/checkout@v4
        with:
          ref: develop
          # PR作成に使うため履歴を取得
          fetch-depth: 0
          # npm ci(依存のpostinstall)時に write 可能なtokenをgit configへ残さない
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate draft (Claude + web_search)
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ ANTHROPIC_API_KEY が未設定です。リポジトリの Settings → Secrets に追加してください。"
            exit 1
          fi
          OUT=$(node scripts/generate-blog-draft.mjs | tail -1)
          echo "生成ファイル: $OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.gen.outputs.file }}
        run: |
          set -eo pipefail
          test -f "$FILE"
          SLUG=$(basename "$FILE" .md)
          BRANCH="auto-draft/${SLUG}-${GITHUB_RUN_ID}"
          git config user.name "cor-blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$FILE"
          git commit -m "draft(blog): 自動下書き ${SLUG}"
          # persist-credentials:false のため push はトークン付きURLで明示的に行う
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          gh pr create --base develop --head "$BRANCH" \
            --title "[自動下書き] ${SLUG}" \
            --body $'Claude が自動生成したブログ下書きです（`isDraft: true` なので公開はされません）。\n\n## 公開する場合\nfrontmatter の `isDraft: true` を `false` に変更してこのPRをマージしてください。\n\n## 公開しない場合\nこのPRをクローズしてください。\n\n## ⚠️ 必ず人の目で確認\n- 数値・統計の**出典URLが実在**し、内容が正しいか\n- トーンが「お手伝い目線」か（断定・効果保証になっていないか）\n- 旧事業名・未取得認証の取得済み主張・プレビューURL/下書きキーが無いか\n（自動ガードレール検査は通過済みですが、最終判断は人が行ってください）'
